schemaVersion: "2"
kind: sandbox
name: markeli-claude
displayName: Claude Code as markeli-agent
description: Built-in Claude Code with the markeli-agent toolchain image, bot SSH pushes and GitLab API credentials
sourceURL: https://github.com/markeli/ai-agents-tooling
extends: claude

sandbox:
  image: ghcr.io/markeli/claude-sandbox:latest

permissions:
  network:
    allow:
      - github.com:22
      - gitlab.com:22
      - api.nuget.org
      # dotnet-install.sh (Dockerfile .NET SDK install step) resolves the latest SDK version per channel
      # from ci.dot.net, then downloads the actual SDK binaries from builds.dotnet.microsoft.com
      - ci.dot.net
      - builds.dotnet.microsoft.com
      # terraform init / ansible-galaxy pull providers, roles and collections from these registries;
      # the balanced sbx policy gates both behind an approval (ghcr.io and registry.gitlab.com are already allowed)
      - registry.terraform.io
      - galaxy.ansible.com

# Plannotator's browser UI (PLANNOTATOR_PORT in the image); sbx picks a free host port, see `sbx ports <name>`
ports:
  - container: 19432
    name: plannotator

credentials:
  - service: gitlab
    description: GitLab.com API token of markeli-agent for glab
    apiKey:
      name: GITLAB_TOKEN
      proxyManaged: true
      inject:
        - domain: gitlab.com
          header: PRIVATE-TOKEN
          format: "%s"
