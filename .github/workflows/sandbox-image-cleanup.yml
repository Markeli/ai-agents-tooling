name: sandbox-image-cleanup

# Deletes tree-* and untagged versions of ghcr.io/<owner>/claude-sandbox older than 30 days; released, latest and
# sha-* images and their parts stay (.github/scripts/sandbox-image-cleanup.sh). GITHUB_TOKEN can delete package
# versions only while this repository has the admin role on the package: see sandbox/README.md, "Image versioning".
on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list what would be deleted
        type: boolean
        default: true

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Delete stale image versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: claude-sandbox
          IMAGE: ghcr.io/${{ github.repository_owner }}/claude-sandbox
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: .github/scripts/sandbox-image-cleanup.sh
