name: sandbox-image

on:
  push:
    branches: [main]
    paths:
      - sandbox/image/**
      - .github/workflows/sandbox-image.yml
  pull_request:
    paths:
      - sandbox/image/**
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claude-sandbox

jobs:
  build:
    # sbx on Apple silicon runs arm64 microVMs; a native arm64 runner avoids QEMU
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: sandbox/image
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Surfaces the immutable sha-<short> tag so it can be copied into a kit's `image:` pin
      # (see sandbox/README.md, "Image versioning") without digging through the GHCR package page.
      - name: Summarize published tags
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '### Published image tags'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
